services:
  # FastAPI Service
  fastapi:
    build:
      context: ../src
      dockerfile: docker/minirag_app/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./env/.env.app
    depends_on:
      pgvector:
        condition: service_healthy

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - fastapi

  # Qdrant (VectorDB)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - rag_network_backend
    restart: always
    volumes:
      - qdrant_data:/var/lib/qdrant

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - rag_network_backend
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.config.file=/etc/prometheus/web-config.yml"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # Grafana Monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - rag_network_backend
    restart: always
    env_file:
      - ./env/.env.grafana
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # MongoDB
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27007:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MONGODB_DATABASE: mini_rag
      MONGODB_USER: ${MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}

  # Postgres VectorDB
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Postgres Exporter
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    networks:
      - rag_network_backend
    depends_on:
      - pgvector
    restart: always

  # Node Exporter
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    networks:
      - rag_network_backend
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "collectors.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    restart: always

  # Prometheus Pushgateway
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9093/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Agent
  grafana_agent:
    image: grafana/agent:latest
    container_name: grafana_agent
    ports:
      - "127.0.0.1:12886:12886/udp"
      - "127.0.0.1:12886:12886"
    networks:
      - rag_network_backend
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:12886/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  rag_network_backend:
    driver: bridge

volumes:
  mongodb_data:
  pgvector_data:
  qdrant_data:
  grafana_data:
